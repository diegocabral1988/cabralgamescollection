name: Build

# Roda o mesmo build que a Vercel roda. Se este check ficar vermelho, o deploy
# também vai falhar — e o site fica parado na versão antiga sem avisar.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
